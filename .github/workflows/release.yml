# Managed by stuttter/.github fleet standards. Do not edit locally.
name: Release plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer version without a leading v.
        required: true
        type: string
      commit:
        description: Full commit SHA at the protected release branch head.
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    uses: stuttter/.github/.github/workflows/wordpress-plugin-release.yml@881d5cfcc94a9c1717ea57f9a0fc9bdf8f42f537
    permissions:
      contents: write
    secrets:
      STUTTTER_WORDPRESS_ORG_USERNAME: ${{ secrets.WORDPRESS_ORG_USERNAME }}
      STUTTTER_WORDPRESS_ORG_PASSWORD: ${{ secrets.WORDPRESS_ORG_PASSWORD }}
    with:
      version: ${{ inputs.version }}
      commit: ${{ inputs.commit }}
      release-branch: "master"
